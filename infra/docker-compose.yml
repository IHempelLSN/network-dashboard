version: "3.9"

x-python-service: &python-service
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - ../:/app
  command: bash -lc "pip install -r requirements.txt && sleep infinity"

services:
  web-backend:
    <<: *python-service
    command: bash -lc "pip install -r requirements.txt && uvicorn web.backend.main:app --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"

  syslog-receiver:
    <<: *python-service
    command: bash -lc "pip install -r requirements.txt && uvicorn receivers.syslog.main:app --host 0.0.0.0 --port 8514"
    ports:
      - "8514:8514"

  snmp-receiver:
    <<: *python-service
    command: bash -lc "pip install -r requirements.txt && uvicorn receivers.snmp.main:app --host 0.0.0.0 --port 8162"
    ports:
      - "8162:8162"

  netflow-receiver:
    <<: *python-service
    command: bash -lc "pip install -r requirements.txt && uvicorn receivers.netflow.main:app --host 0.0.0.0 --port 82055"
    ports:
      - "82055:82055"

  grpc-receiver:
    <<: *python-service
    command: bash -lc "pip install -r requirements.txt && uvicorn receivers.grpc.main:app --host 0.0.0.0 --port 57400"
    ports:
      - "57400:57400"

  snmp-poller:
    <<: *python-service
    command: bash -lc "pip install -r requirements.txt && uvicorn poller.snmp_poller.main:app --host 0.0.0.0 --port 8601"
    ports:
      - "8601:8601"

  node-discovery:
    <<: *python-service
    command: bash -lc "pip install -r requirements.txt && uvicorn poller.node_discovery.main:app --host 0.0.0.0 --port 8602"
    ports:
      - "8602:8602"

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
